# Use a separate project, database, and key volume for Session 03.
# docker compose -p notesapp-session03 -f compose.session03.yml up -d --build --wait
x-homework: &homework
  image: notesapp-session03-web:local
  build:
    context: .
    dockerfile: session03/Dockerfile
  environment: &homework-environment
    DB_HOST: db
    DB_NAME: notesapp
    DB_USER: notesapp
    POSTGRES_PASSWORD: notesapp_pg_pw_2024
    JWT_SECRET: s3cr3t
    SECRET_KEY: dev-session-key
    NOTESAPP_COMMENT_KEY_FILE: /run/notesapp-secrets/comments.key
    NOTESAPP_CSV_HMAC_KEY_FILE: /run/notesapp-export/csv-hmac.key
  volumes:
    - commentkey:/run/notesapp-secrets
    - csvhmackey:/run/notesapp-export
  read_only: true
  tmpfs:
    - /tmp
  mem_limit: 256m
  cpus: 1.0

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0

  keygen:
    <<: *homework
    entrypoint: ["python"]
    command: ["generate_key.py"]
    volumes:
      - commentkey:/run/notesapp-secrets

  migrate:
    <<: *homework
    entrypoint: ["python", "runtime.py"]
    command: ["python", "migrate_comments.py"]
    depends_on:
      db:
        condition: service_healthy
      keygen:
        condition: service_completed_successfully

  web:
    <<: *homework
    ports:
      - "127.0.0.1:8083:5000"
    networks:
      - default
      - frontend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  default:
    internal: true
  frontend:
    driver: bridge
volumes:
  pgdata:
  commentkey:
  csvhmackey:
