# Keep the existing local containment overlay, then apply HTTPS last:
# docker compose -p notesapp-lab -f docker-compose.yml -f compose.lab.yml -f docker-compose.https.yml up -d --no-build
services:
  web:
    ports: !reset []
    expose:
      - "5000"
    networks: !override
      - default

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "127.0.0.1:443:443"
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - default
      - frontend
    mem_limit: 128m
    cpus: 1.0
