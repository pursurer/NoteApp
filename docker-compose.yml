services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: notesapp
      POSTGRES_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesapp -d notesapp"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      DB_HOST: db
      DB_NAME: notesapp
      DB_USER: notesapp
      POSTGRES_PASSWORD: notesapp_pg_pw_2024
      JWT_SECRET: s3cr3t
      SECRET_KEY: dev-session-key
      NOTESAPP_COMMENT_KEY_FILE: /run/notesapp-secrets/comments.key
      NOTESAPP_CSV_HMAC_KEY_FILE: /run/notesapp-export/csv-hmac.key
    ports:
      - "127.0.0.1:8080:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - commentkey:/run/notesapp-secrets
      - csvhmackey:/run/notesapp-export
    networks:
      - default
      - frontend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

networks:
  default:
    internal: true
  frontend:
    driver: bridge

volumes:
  pgdata:
  commentkey:
  csvhmackey:
